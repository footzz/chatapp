services:
  # 前端服務 - Node.js + Express 提供靜態文件
  - type: web
    name: simple-fullstack-frontend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  # 後端服務 - Python FastAPI
  - type: web
    name: simple-fullstack-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
